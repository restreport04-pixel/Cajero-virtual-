<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cajero Automático - Autenticación</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="auth-container">
        <header class="auth-header">
            <span class="badge-status">Sistema Bancario Local</span>
            <h1>NeoBank <span>ATM</span></h1>
            <h2>Inicia sesión o crea una cuenta para operar</h2>
        </header>

        <section class="forms-wrapper">
            <article class="card-form">
                <form id="form-login">
                    <h3>Iniciar Sesión</h3>
                    <div class="input-group">
                        <label for="login-user">Usuario / Email</label>
                        <input type="text" id="login-user" placeholder="Ingrese su usuario o correo" required>
                    </div>
                    <div class="input-group">
                        <label for="login-password">Contraseña</label>
                        <input type="password" id="login-password" placeholder="Ingrese su contraseña" required>
                    </div>
                    <input type="submit" class="btn-primary" value="Iniciar Sesión">
                </form>
            </article>
            
            <article class="card-form">
                <form id="form-register">
                    <h3>Registrarse</h3>                    
                    <div class="input-group">
                        <label for="reg-name">Nombre</label>
                        <input type="text" id="reg-name" placeholder="Ingrese su nombre" required>
                    </div>
                    <div class="input-group">
                        <label for="reg-apellido">Apellidos</label>
                        <input type="text" id="reg-apellido" placeholder="Ingrese sus 2 apellidos" required>
                    </div>
                    <div class="input-group">
                        <label for="reg-email">Email</label>
                        <input type="email" id="reg-email" placeholder="Ingrese su correo electrónico" required>
                    </div>
                    <div class="input-group">
                        <label for="reg-password">Contraseña</label>
                        <input type="password" id="reg-password" placeholder="Ingrese su contraseña" required>
                    </div>
                    <input type="submit" class="btn-secondary" value="Crear Cuenta">
                </form>
            </article>
        </section>
    </main>

    <!-- Buenas prácticas: script al final del body -->
    <script src="js/script.js"></script>
</body>
</html>
